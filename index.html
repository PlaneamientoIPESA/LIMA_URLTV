<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rotador IPESA</title>
</head>

<body style="margin:0; background:black; overflow:hidden;">

<div id="contenedor" style="width:100%; height:100vh;"></div>

<script>

let rotador = [
  { titulo: "FACTURACIÓN JD", src: "FACT_JD.jpg" },
  { titulo: "FACTURACIÓN WIRTGEN", src: "FACT_WIR.jpg" },

  { titulo: "AGENDA MAQUINARIA", src: "AGENDA_ATE1.jpg" },
  { titulo: "AGENDA MAQUINARIA", src: "AGENDA_ATE2.jpg" },
  { titulo: "AGENDA WIRTGEN", src: "AGENDA_WIR.jpg" },
  { titulo: "AGENDA WIRTGEN_2", src: "AGENDA_WIR_2.jpg" },
  { titulo: "AGENDA CAMIONES", src: "AGENDA_CAM.jpg" },
  { titulo: "AGENDA CAMIONES2", src: "AGENDA_CAM2.jpg" },

  { titulo: "INDICADOR PRODUCTIVIDAD", src: "IND_PROD.jpg" },
  { titulo: "FLYER JP", src: "FLYER_JP.jpeg" },
  { titulo: "REGLAS ASESOR DE SERVICIOS", src: "300126_IPESA_CUADRO Reglas Asesor de Servicios (1)_page-0001.jpg" },

  { titulo: "TÉCNICO JUlIO", src: "Técnico-JUL.png" },
  { titulo: "DESCUENTOS", src: "DESCUENTOS.jpeg" },
  { titulo: "ESPECIALISTAS", src: "ESPECIALISTAS.jpeg" },
];

let i = 0;

function rotar() {
  const contenedor = document.getElementById("contenedor");
  const actual = rotador[i];

  contenedor.innerHTML = `
    <div style="width:100%; height:100%; display:flex; flex-direction:column; background:black;">
      <div style="color:white; font-size:26px; font-weight:bold; padding:12px 20px; font-family:Arial;">
        ${actual.titulo}
      </div>
      <img 
        src="${actual.src}" 
        style="width:100%; height:100%; object-fit:contain; background:black;">
    </div>
  `;

  i = (i + 1) % rotador.length;
}

rotar();
setInterval(rotar, 25000);

/* ===== SISTEMA ANTI-REPOSO REAL (Screen Wake Lock API) ===== */
let wakeLock = null;

async function solicitarWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      console.log('Pantalla bloqueada para evitar reposo.');
    }
  } catch (err) {
    console.log(`Error al activar Wake Lock: ${err.name}, ${err.message}`);
  }
}

// 1. Activar al cargar la página
solicitarWakeLock();

// 2. Volver a activar si la pestaña vuelve a enfocarse o se minimiza/restaura
document.addEventListener('visibilitychange', async () => {
  if (wakeLock !== null && document.visibilityState === 'visible') {
    await solicitarWakeLock();
  }
});

// 3. Activar si el usuario hace clic o toca la pantalla una vez
document.addEventListener('click', solicitarWakeLock);

</script>

</body>
</html>
